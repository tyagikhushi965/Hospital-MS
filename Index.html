<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediCore HMS · Smart Hospital Management</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#17325a;--blue:#2c5a94;--sky:#dbe6f3;--bg:#f2eadb;--card:#faf6ee;--ink:#14233b;--mute:#6a7385;--line:#e2d8c4;--lime:#c5f03a;--limeink:#17325a;--side:#17325a;--sideink:#e8eef7;--warn:#b4532a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--navy:#9fc0ec;--blue:#7ba5de;--sky:#22385a;--bg:#0f1c31;--card:#162843;--ink:#eef2f8;--mute:#9aa7bd;--line:#26405f;--side:#0b1526;--sideink:#dbe6f3;--warn:#f0905f}}
:root[data-theme="dark"]{color-scheme:dark;--navy:#9fc0ec;--blue:#7ba5de;--sky:#22385a;--bg:#0f1c31;--card:#162843;--ink:#eef2f8;--mute:#9aa7bd;--line:#26405f;--side:#0b1526;--sideink:#dbe6f3;--warn:#f0905f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Manrope,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sideink);padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-size:22px;margin-bottom:26px;padding-left:8px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--lime);display:grid;place-items:center;color:#17325a;font-style:normal;font-weight:700;font-family:Manrope}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;width:100%;box-sizing:border-box;color:var(--sideink);opacity:.78;font-weight:500}
nav button:hover{opacity:1;background:rgba(255,255,255,.07)}
nav button.on{opacity:1;background:rgba(255,255,255,.1);box-shadow:inset 3px 0 0 var(--lime)}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.foot{margin-top:auto;font-size:12px;opacity:.6;padding-left:8px}
main{padding:36px clamp(18px,4vw,48px) 60px;max-width:1200px;width:100%}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.head h1{font-size:clamp(28px,4vw,40px);color:var(--navy)}
.head p{margin:4px 0 0;color:var(--mute);max-width:56ch}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.stat b{font-family:Fraunces,serif;font-size:38px;color:var(--navy);display:block;line-height:1.1}
.stat span{color:var(--mute);font-size:13px}
.stat.hot{background:var(--navy);border-color:var(--navy)}.stat.hot b{color:var(--lime)}.stat.hot span{color:#c9d6e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stat.hot{background:#1f3a63}}
h3{font-size:19px;color:var(--navy);margin-bottom:12px}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--sky);color:var(--navy);font-weight:600}
.tag.lime{background:var(--lime);color:#17325a}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mute);gap:4px;font-weight:600;flex:1;min-width:120px}
input,select{font:inherit;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{font:inherit;font-weight:700;border:0;cursor:pointer;padding:10px 18px;border-radius:11px;background:var(--navy);color:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0f1c31}}
.btn.lime{background:var(--lime);color:#17325a}.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.06)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:600;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.empty{color:var(--mute);padding:14px 0}
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.bed{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);cursor:pointer;font-size:12.5px;min-height:74px;text-align:left;font:inherit;color:var(--ink)}
.bed b{display:block;font-size:13px}
.bed.occ{background:var(--navy);color:#f2eadb;border-color:var(--navy)}
.bed.free{border-style:dashed;color:var(--mute)}
.bed.free:hover{border-color:var(--lime);background:var(--card)}
.heap{display:flex;flex-direction:column;gap:8px}
.hn{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:13px;background:var(--bg);border:1px solid var(--line)}
.hn .sev{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--sky);color:var(--navy)}
.hn.s1 .sev{background:var(--lime);color:#17325a}.hn.s1{border-color:var(--lime)}
.path{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.path .n{padding:7px 13px;border-radius:99px;background:var(--navy);color:var(--bg)}
.path .a{color:var(--mute)}
.path .n:last-child{background:var(--lime);color:#17325a;font-weight:700}
.log li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.log{list-style:none;padding:0;margin:0}
.dsrow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline;flex-wrap:wrap}
.dsrow:last-child{border:0}.dsrow b{min-width:130px;color:var(--navy)}.dsrow span{color:var(--mute);flex:1;min-width:180px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--bg);padding:11px 20px;border-radius:99px;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;font-weight:600}
.toast.show{opacity:1}
@media (max-width:820px){
.app{grid-template-columns:1fr}
aside{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:12px;gap:4px;z-index:10;top:env(safe-area-inset-top,0px)}
.brand,.foot{display:none}
nav{display:flex;gap:4px}nav button{white-space:nowrap;padding:9px 13px;box-shadow:none!important}nav button.on{background:var(--lime);color:#17325a}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="brand"><i>M</i>MediCore HMS</div>
<nav id="nav"></nav>
<div class="foot">Smart Hospital DBMS<br>Data structures in action</div>
</aside>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============ DATA STRUCTURES ============ */
// 1. Hash map (JS Map): patient records by ID, O(1) lookup
// 2. Binary search tree: patients sorted by name, in-order listing
// 3. Min-heap: emergency triage priority queue
// 4. FIFO queues: outpatient appointments per doctor
// 5. Stack: activity log with undo
// 6. Array: bed allocation table
// 7. Graph + BFS: wayfinding between departments
class BST{constructor(){this.root=null}
 insert(k,v){const n={k,v,l:null,r:null};if(!this.root){this.root=n;return}let c=this.root;for(;;){if(k<c.k){if(!c.l){c.l=n;return}c=c.l}else{if(!c.r){c.r=n;return}c=c.r}}}
 inorder(n=this.root,o=[]){if(n){this.inorder(n.l,o);o.push(n.v);this.inorder(n.r,o)}return o}}
class MinHeap{constructor(a=[]){this.a=a}
 lt(i,j){const x=this.a[i],y=this.a[j];return x.sev<y.sev||(x.sev===y.sev&&x.t<y.t)}
 push(x){const a=this.a;a.push(x);let i=a.length-1;while(i>0){const p=(i-1)>>1;if(!this.lt(i,p))break;[a[i],a[p]]=[a[p],a[i]];i=p}}
 pop(){const a=this.a;if(!a.length)return null;const top=a[0],last=a.pop();if(a.length){a[0]=last;let i=0;for(;;){let l=2*i+1,r=l+1,m=i;if(l<a.length&&this.lt(l,m))m=l;if(r<a.length&&this.lt(r,m))m=r;if(m===i)break;[a[i],a[m]]=[a[m],a[i]];i=m}}return top}
 sorted(){return[...this.a].sort((x,y)=>x.sev-y.sev||x.t-y.t)}}
const MAP={Entrance:["Reception"],Reception:["Entrance","Emergency","OPD"],Emergency:["Reception","ICU","Radiology"],OPD:["Reception","Laboratory","Radiology"],Laboratory:["OPD","Pharmacy"],Radiology:["OPD","Emergency","Ward"],ICU:["Emergency","Ward"],Ward:["Radiology","ICU","Pharmacy"],Pharmacy:["Laboratory","Ward"]};
function bfs(s,t){const q=[s],prev={[s]:null};while(q.length){const u=q.shift();if(u===t)break;for(const v of MAP[u])if(!(v in prev)){prev[v]=u;q.push(v)}}const p=[];for(let c=t;c;c=prev[c])p.unshift(c);return p}

/* ============ STATE ============ */
const DOCS=[["D1","Dr. Anika Rao","Cardiology"],["D2","Dr. Marcus Hale","Orthopaedics"],["D3","Dr. Leila Haddad","Paediatrics"],["D4","Dr. Sameer Kapoor","General Medicine"]];
const NB=20,KEY="meridian-hms-v1";
let db={seq:0,patients:[],heap:[],appts:{D1:[],D2:[],D3:[],D4:[]},beds:Array(NB).fill(null),log:[],served:0};
try{const s=localStorage.getItem(KEY);if(s)db=JSON.parse(s)}catch(e){}
if(!db.patients.length&&!db.seq){seed()}
function seed(){[["Ishaan Mehta",34,"Cardiology","Chest pain"],["Priya Nair",8,"Paediatrics","Fever"],["Tom Fischer",61,"Orthopaedics","Hip fracture"],["Zara Qureshi",27,"General Medicine","Migraine"]].forEach(p=>admit(...p,true));triage("P-003",2,true);triage("P-001",1,true);db.appts.D1.push("P-001");db.appts.D4.push("P-004");db.log=[]}
const P=()=>new Map(db.patients.map(p=>[p.id,p])); // hash map rebuilt from table rows
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2200)}
function push(a){db.log.push(a);if(db.log.length>40)db.log.shift()}

/* ============ ACTIONS ============ */
function admit(name,age,dept,cond,quiet){
 const id="P-"+String(++db.seq).padStart(3,"0");
 const bed=db.beds.indexOf(null);if(bed>-1)db.beds[bed]=id;
 db.patients.push({id,name,age:+age,dept,cond,bed});
 if(!quiet)push({t:"admit",id});return id}
function discharge(id,quiet){
 const p=P().get(id);if(!p)return;
 const snap={p:{...p},beds:db.beds.indexOf(id),heap:db.heap.filter(h=>h.id===id),appts:Object.entries(db.appts).filter(([d,q])=>q.includes(id)).map(([d])=>d)};
 db.patients=db.patients.filter(x=>x.id!==id);
 db.beds=db.beds.map(b=>b===id?null:b);
 db.heap=db.heap.filter(h=>h.id!==id);
 for(const d in db.appts)db.appts[d]=db.appts[d].filter(x=>x!==id);
 if(!quiet)push({t:"discharge",snap})}
function triage(id,sev,quiet){const h=new MinHeap(db.heap);h.push({id,sev:+sev,t:Date.now()+db.heap.length});db.heap=h.a;if(!quiet)push({t:"triage",id})}
function undo(){
 const a=db.log.pop();if(!a)return toast("Nothing to undo");
 if(a.t==="admit")discharge(a.id,true);
 else if(a.t==="discharge"){const s=a.snap;db.patients.push(s.p);if(s.beds>-1&&!db.beds[s.beds])db.beds[s.beds]=s.p.id;s.heap.forEach(x=>{const h=new MinHeap(db.heap);h.push(x);db.heap=h.a});s.appts.forEach(d=>db.appts[d].push(s.p.id))}
 else if(a.t==="triage"){db.heap=db.heap.filter(h=>h.id!==a.id);const h=new MinHeap([]);db.heap.forEach(x=>h.push(x));db.heap=h.a}
 else if(a.t==="book"){db.appts[a.d]=db.appts[a.d].filter((x,i,r)=>!(x===a.id&&i===r.lastIndexOf(a.id)))}
 save();render();toast("Last action undone")}

/* ============ VIEWS ============ */
const TABS=[["overview","Overview"],["patients","Patients"],["emergency","Emergency"],["appts","Appointments"],["beds","Beds"],["route","Wayfinding"]];
let tab=(location.hash||"#overview").slice(1);if(!TABS.some(t=>t[0]===tab))tab="overview";
let q="";
const V={};
V.overview=()=>{
 const free=db.beds.filter(b=>!b).length,wait=Object.values(db.appts).reduce((s,x)=>s+x.length,0);
 return head("Good day, team","A live view of admissions, triage, queues and beds. Everything you change here updates the underlying structures.")+
 `<div class="grid g4"><div class="card stat hot"><b>${db.heap.length}</b><span>In emergency triage</span></div><div class="card stat"><b>${db.patients.length}</b><span>Admitted patients</span></div><div class="card stat"><b>${free}/${NB}</b><span>Beds free</span></div><div class="card stat"><b>${wait}</b><span>Waiting for a doctor</span></div></div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h3>How each module stores data</h3>
 ${[["Hash map","Patient records by ID","O(1) lookup"],["Binary search tree","Name-sorted patient list","O(log n) insert"],["Min-heap","Emergency triage","O(log n) next patient"],["Queue","Doctor appointments","First in, first out"],["Stack","Activity log and undo","Last in, first out"],["Array","Bed allocation table","Direct bed index"],["Graph + BFS","Hospital wayfinding","Fewest hops route"]].map(r=>`<div class="dsrow"><b>${r[0]}</b><span>${r[1]}</span><span class="tag">${r[2]}</span></div>`).join("")}</div>
 <div class="card"><h3>Recent activity</h3>${logList()}<div style="margin-top:14px"><button class="btn lime" onclick="undo()">Undo last action</button></div></div></div>`};
function logList(){const l=[...db.log].reverse().slice(0,8);if(!l.length)return`<div class="empty">No actions yet. Admit a patient to get started.</div>`;
 return`<ul class="log">${l.map(a=>`<li><span>${{admit:"Admitted",discharge:"Discharged",triage:"Triaged",book:"Booked"}[a.t]} ${esc(a.id||a.snap.p.id)}</span><span class="tag">${a.t}</span></li>`).join("")}</ul>`}
function head(t,s,extra=""){return`<div class="head"><div><h1>${t}</h1><p>${s}</p></div>${extra}</div>`}
V.patients=()=>{
 const m=P(),bst=new BST();db.patients.forEach(p=>bst.insert(p.name.toLowerCase(),p));
 let list=bst.inorder();const ql=q.trim().toLowerCase();
 if(ql)list=m.has(q.trim().toUpperCase())?[m.get(q.trim().toUpperCase())]:list.filter(p=>p.name.toLowerCase().includes(ql));
 return head("Patients","Admit, search and discharge. Search by ID uses the hash map; name results come from the tree in sorted order.")+
 `<div class="card"><h3>Admit a patient</h3><div class="row"><label>Full name<input id="fn" placeholder="e.g. Aarav Singh"></label><label>Age<input id="fa" type="number" min="0" max="120" value="30"></label><label>Department<select id="fd">${[...new Set(DOCS.map(d=>d[2]))].map(d=>`<option>${d}</option>`).join("")}</select></label><label>Condition<input id="fc" placeholder="e.g. Fever"></label><button class="btn" onclick="doAdmit()">Admit patient</button></div></div>
 <div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Patient register</h3><label style="max-width:260px;flex:none"><input id="sq" placeholder="Search name or ID" value="${esc(q)}" oninput="q=this.value;render(true)"></label></div>
 <div class="tw">${list.length?`<table><tr><th>ID</th><th>Name</th><th>Age</th><th>Department</th><th>Condition</th><th>Bed</th><th></th></tr>${list.map(p=>`<tr><td><span class="tag">${p.id}</span></td><td><b>${esc(p.name)}</b></td><td>${p.age}</td><td>${esc(p.dept)}</td><td>${esc(p.cond||"-")}</td><td>${p.bed>-1&&db.beds[p.bed]===p.id?"B"+(p.bed+1):'<span class="tag">none</span>'}</td><td><button class="btn ghost" onclick="doDis('${p.id}')">Discharge</button></td></tr>`).join("")}</table>`:`<div class="empty">No patients match. Admit one above or clear the search.</div>`}</div></div>`};
V.emergency=()=>{
 const h=new MinHeap([...db.heap]).sorted(),m=P();
 return head("Emergency triage","Severity 1 is the most critical. The min-heap always returns the most urgent patient first, and the longest-waiting one when severities tie.",`<button class="btn lime" onclick="doNext()">Call next patient</button>`)+
 `<div class="grid g2"><div class="card"><h3>Add to triage</h3><div class="row"><label>Patient<select id="tp">${db.patients.map(p=>`<option value="${p.id}">${p.id} · ${esc(p.name)}</option>`).join("")}</select></label><label>Severity<select id="ts"><option value="1">1 · Critical</option><option value="2">2 · Emergent</option><option value="3" selected>3 · Urgent</option><option value="4">4 · Less urgent</option><option value="5">5 · Routine</option></select></label><button class="btn" onclick="doTriage()">Add</button></div></div>
 <div class="card"><h3>Queue order</h3><div class="heap">${h.length?h.map((x,i)=>`<div class="hn s${x.sev}"><div class="sev">${x.sev}</div><div><b>${esc(m.get(x.id)?.name||x.id)}</b><div style="font-size:12.5px;color:var(--mute)">${x.id} · position ${i+1}</div></div></div>`).join(""):`<div class="empty">Triage is clear. Add a patient to start the queue.</div>`}</div></div></div>`};
V.appts=()=>{
 const m=P();
 return head("Appointments","Each doctor has a first-in, first-out queue. Booking adds to the back and serving takes from the front.")+
 `<div class="card"><h3>Book a slot</h3><div class="row"><label>Patient<select id="bp">${db.patients.map(p=>`<option value="${p.id}">${p.id} · ${esc(p.name)}</option>`).join("")}</select></label><label>Doctor<select id="bd">${DOCS.map(d=>`<option value="${d[0]}">${d[1]} · ${d[2]}</option>`).join("")}</select></label><button class="btn" onclick="doBook()">Book</button></div></div>
 <div class="grid g2" style="margin-top:16px">${DOCS.map(d=>`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${d[1]}</h3><span class="tag">${d[2]}</span></div><div style="margin:12px 0">${db.appts[d[0]].length?db.appts[d[0]].map((id,i)=>`<div class="hn" style="margin-bottom:6px"><div class="sev">${i+1}</div><b>${esc(m.get(id)?.name||id)}</b>${i===0?'<span class="tag lime" style="margin-left:auto">Next</span>':""}</div>`).join(""):`<div class="empty">No one waiting.</div>`}</div><button class="btn ghost" onclick="doServe('${d[0]}')">Serve next</button></div>`).join("")}</div>`};
V.beds=()=>{
 const m=P();
 return head("Bed management","Twenty beds in one array. New admissions take the first free index, and tapping an occupied bed releases it.")+
 `<div class="card"><div class="beds">${db.beds.map((b,i)=>b?`<button class="bed occ" onclick="doFree(${i})"><b>Bed ${i+1}</b>${esc(m.get(b)?.name||b)}</button>`:`<button class="bed free" onclick="doAssign(${i})"><b>Bed ${i+1}</b>Free</button>`).join("")}</div>
 <p style="color:var(--mute);margin:16px 0 0;font-size:13.5px">Tap a free bed to give it to the next admitted patient who has no bed.</p></div>`};
V.route=()=>{
 const ks=Object.keys(MAP),f=window.rf||"Entrance",t=window.rt||"ICU",p=bfs(f,t);
 return head("Wayfinding","The hospital is a graph of departments. Breadth-first search finds the route with the fewest stops.")+
 `<div class="card"><div class="row"><label>From<select id="rf" onchange="window.rf=this.value;render(true)">${ks.map(k=>`<option ${k===f?"selected":""}>${k}</option>`).join("")}</select></label><label>To<select id="rt" onchange="window.rt=this.value;render(true)">${ks.map(k=>`<option ${k===t?"selected":""}>${k}</option>`).join("")}</select></label></div>
 <div class="path">${p.map((n,i)=>(i?'<span class="a">to</span>':"")+`<span class="n">${n}</span>`).join("")}</div><p style="color:var(--mute);margin:14px 0 0">${p.length-1} ${p.length===2?"step":"steps"} from ${f} to ${t}.</p></div>`};

/* ============ HANDLERS ============ */
const $=id=>document.getElementById(id);
function doAdmit(){const n=$("fn").value.trim();if(!n)return toast("Enter the patient’s name");const id=admit(n,$("fa").value,$("fd").value,$("fc").value.trim());save();q="";render();toast(`Admitted ${id}`)}
function doDis(id){discharge(id);save();render();toast(`Discharged ${id}. Undo is available.`)}
function doTriage(){const id=$("tp").value;if(!id)return toast("Admit a patient first");if(db.heap.some(h=>h.id===id))return toast("Already in triage");triage(id,$("ts").value);save();render();toast("Added to triage")}
function doNext(){const h=new MinHeap(db.heap),x=h.pop();if(!x)return toast("Triage queue is empty");db.heap=h.a;save();render();toast(`Next: ${P().get(x.id)?.name||x.id} (severity ${x.sev})`)}
function doBook(){const id=$("bp").value,d=$("bd").value;if(!id)return toast("Admit a patient first");db.appts[d].push(id);push({t:"book",id,d});save();render();toast("Appointment booked")}
function doServe(d){const id=db.appts[d].shift();if(!id)return toast("Queue is empty");db.served++;save();render();toast(`Now serving ${P().get(id)?.name||id}`)}
function doFree(i){db.beds[i]=null;db.patients.forEach(p=>{if(p.bed===i)p.bed=-1});save();render();toast(`Bed ${i+1} released`)}
function doAssign(i){const p=db.patients.find(x=>!db.beds.includes(x.id));if(!p)return toast("Every patient already has a bed");db.beds[i]=p.id;p.bed=i;save();render();toast(`${p.name} moved to bed ${i+1}`)}

function render(keep){
 $("nav").innerHTML=TABS.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("");
 $("main").innerHTML=V[tab]();
 if(keep&&tab==="patients"){const s=$("sq");s.focus();s.setSelectionRange(s.value.length,s.value.length)}
}
function go(t){tab=t;try{location.hash=t}catch(e){}scrollTo(0,0);render()}
addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(V[t]&&t!==tab){tab=t;render()}});
save();render();
</script>
</body>
</html>
